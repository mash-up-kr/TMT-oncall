spring:
  application:
    name: tmt-oncall
  main:
    web-application-type: none
  sql:
    init:
      mode: always

# 환경변수 참조에는 기본값을 두지 않는다. 값이 없으면 기동 단계에서 실패한다 —
# 봇이 빈 토큰으로 반쯤 뜬 채 돌다가 장애 때 조용히 아무것도 못 하는 것이 더 나쁘다.
# 프로젝트 상수(레포·프로젝트 키·정책 임계값)는 환경변수가 아니라 값을 직접 둔다.
oncall:
  enabled: true

  trigger:
    # 끄면 주기 폴링이 등록되지 않는다. 봇 자체를 멈추는 killSwitch(oncall.enabled)와는 별개다.
    enabled: true

  target:
    key: tmt-be
    repo: mash-up-kr/TMT-BE
    build-command: ./gradlew build
    jira-project-key: TMT
    sentry-project-slug: tmt-be
    workspace: ${TMT_WORKSPACE}
    health-url: ${TMT_HEALTH_URL}
    health-poll-interval: 60s
    # 배포 중 재시작(1~2분)을 다운으로 오인하지 않으면서 3분 안에 감지하는 값.
    health-failure-threshold: 3
    discord-channel-id: ${DISCORD_ONCALL_CHANNEL_ID}

  discord:
    bot-token: ${DISCORD_BOT_TOKEN}
    roles:
      design: ${DISCORD_ROLE_ID_DESIGN}
      web: ${DISCORD_ROLE_ID_WEB}
      spring: ${DISCORD_ROLE_ID_SPRING}

  jira:
    base-url: https://ttalkkak.atlassian.net
    email: ${JIRA_EMAIL}
    api-token: ${JIRA_API_TOKEN}

  github:
    token: ${GITHUB_TOKEN}

  sentry:
    base-url: https://sentry.io
    poll-interval: 60s
    auth-token: ${SENTRY_AUTH_TOKEN}
    org-slug: ${SENTRY_ORG_SLUG}

  agent:
    # systemd는 최소 PATH로 뜨는 경우가 많아 절대경로가 필요할 수 있다.
    binary: ${ONCALL_AGENT_BINARY}
    timeout: 10m
    # api-key(종량제) | subscription(구독제). 전환은 이 값 하나만 바꾸면 되고 호출 코드는 그대로다.
    #
    # 자격 증명은 여기 바인딩하지 않는다. 우리는 쓰지 않고 하위 프로세스에 넘기기만 하는 값이라,
    # 설정 객체에 담아 로그·덤프에 흘리는 것보다 AgentRunner가 환경변수에서 직접 읽어
    # 하위 프로세스로 옮기는 편이 안전하다.
    #   api-key      → ONCALL_AGENT_API_KEY 를 읽어 CLI가 아는 이름으로 넘긴다. 없으면 기동 실패
    #   subscription → 하위 프로세스 환경에서 그 이름을 제거한다.
    #                  남아 있으면 구독 자격 증명을 가리고 조용히 종량제로 청구된다
    billing: ${ONCALL_BILLING}
    # 단가는 per 1M tokens. 캐시 쓰기/읽기 단가는 입력 단가에서 파생한다 (CallBudget 참고).
    # 모델과 단가를 함께 필수로 둬서, 모델만 바꾸고 단가를 안 바꿔 집계가 어긋나는 일을 막는다.
    models:
      triage:
        id: ${ONCALL_MODEL_TRIAGE}
        input-per-mtok: ${ONCALL_PRICE_TRIAGE_IN}
        output-per-mtok: ${ONCALL_PRICE_TRIAGE_OUT}
      analyze:
        id: ${ONCALL_MODEL_ANALYZE}
        input-per-mtok: ${ONCALL_PRICE_ANALYZE_IN}
        output-per-mtok: ${ONCALL_PRICE_ANALYZE_OUT}
      fix:
        id: ${ONCALL_MODEL_FIX}
        input-per-mtok: ${ONCALL_PRICE_FIX_IN}
        output-per-mtok: ${ONCALL_PRICE_FIX_OUT}

  guard:
    max-calls-per-hour: 5
    max-calls-per-day: 10
    # 구독제에서는 무시된다 (달러 개념이 없어 호출 횟수 상한만 남는다).
    max-cost-per-month: 7.0
    duplicate-window: 30m

  store:
    path: ${ONCALL_STORE_PATH}
